name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_version: ${{ steps.check_tag.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inspect Tag and Generate Release Notes
        id: check_tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const versionTagPattern = '[0-9]*.[0-9]*.[0-9]*';

            const tagVersion = context.ref.replace('refs/tags/', '');

            const buildGradle = fs.readFileSync('app/build.gradle.kts', 'utf8');
            const match = buildGradle.match(/versionName\s*=\s*"([^"]+)"/);
            if (!match) {
              core.setFailed('Could not find versionName in app/build.gradle.kts');
              return;
            }
            const gradleVersion = match[1];
            if (tagVersion !== gradleVersion) {
              core.setFailed(`Tag version (${tagVersion}) does not match build.gradle.kts version (${gradleVersion})`);
              return;
            }
            core.setOutput('tag_version', tagVersion);

            let prevTag = '';
            try {
              prevTag = execSync(`git describe --tags --abbrev=0 --match '${versionTagPattern}' HEAD^`).toString().trim();
            } catch (_) {}
            const rangeArg = prevTag ? `${prevTag}..HEAD` : 'HEAD';
            const log = execSync(`git log ${rangeArg} --no-merges --pretty=format:%s`).toString();

            const notes = log
              .split('\n')
              .filter(line => line.length > 0)
              .filter(line => !/^minor /i.test(line) && !/^\[minor\]/i.test(line))
              .map(line => line.replace(/ \(#\d+\)$/, ''))
              .join('\n');

            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
            const changelogUrl = prevTag
              ? `${repoUrl}/compare/${prevTag}...${tagVersion}`
              : `${repoUrl}/releases/tag/${tagVersion}`;
            const notesWithChangelog = notes
              ? `${notes}\n\nFull Changelog: ${changelogUrl}`
              : `Full Changelog: ${changelogUrl}`;

            core.info(`Generated release notes:\n${notesWithChangelog}`);
            core.setOutput('release_notes', notesWithChangelog);

            const whatsnewDir = `${process.env.RUNNER_TEMP}/whatsnew`;
            fs.mkdirSync(whatsnewDir, { recursive: true });
            fs.writeFileSync(`${whatsnewDir}/whatsnew-en-US`, notesWithChangelog);
            core.setOutput('whatsnew_dir', whatsnewDir);

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Decode Keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            if [ -z "${{ steps.check_tag.outputs.tag_version }}" ]; then
              echo "No keystore provided, skipping signing setup for non-release build."
            else
              echo "Error: No keystore provided for release build. Please set the KEYSTORE_BASE64 secret."
              exit 1
            fi
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --build-cache

      - name: List build outputs
        run: find app/build/outputs -name '*.aab' -o -name '*.apk' | sort

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: app-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        id: create_release
        if: steps.check_tag.outputs.tag_version
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          body: ${{ steps.check_tag.outputs.release_notes }}
          tag_name: ${{ steps.check_tag.outputs.tag_version }}
          name: Release ${{ steps.check_tag.outputs.tag_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Play Store (Internal Testing)
        if: steps.check_tag.outputs.tag_version
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: it.locati.michele.redialer
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
          whatsNewDirectory: ${{ steps.check_tag.outputs.whatsnew_dir }}
