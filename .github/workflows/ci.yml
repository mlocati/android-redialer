name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_version: ${{ steps.check_tag.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check version tag
        id: check_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          GRADLE_VERSION=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match build.gradle.kts version ($GRADLE_VERSION)"
            exit 1
          fi
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease --build-cache

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: app-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Create Release
        id: create_release
        if: steps.check_tag.outputs.tag_version
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          tag_name: ${{ steps.check_tag.outputs.tag_version }}
          name: Release ${{ steps.check_tag.outputs.tag_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Release URL to Summary
        if: steps.check_tag.outputs.tag_version
        run: |
          echo "### Release created" >> $GITHUB_STEP_SUMMARY
          echo "The new release is available here: ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
