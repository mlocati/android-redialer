name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (<major>.<minor>.<patch>)'
        required: false
        type: string
        default: ''
      stability:
        description: 'Release stability (alpha, beta, rc, or stable)'
        required: false
        default: 'stable'
        type: choice
        options:
          - alpha (Internal Testing)
          - beta (Closed Testing)
          - rc (Closed Testing)
          - stable (GA)
      unstableSerial:
        description: 'Serial number for unstable releases (e.g. 1 for alpha.1, 2 for alpha.2, etc.)'
        required: false
        type: number

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inspect workflow dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        id: inspect_workflow_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const versionInput = '${{ github.event.inputs.version }}'.trim();
            const stabilityInput = '${{ github.event.inputs.stability }}'.trim().replace(/\s.*$/, '').toLowerCase();
            const unstableSerialInput = '${{ github.event.inputs.unstableSerial }}'.trim();

            if (!/^\d+\.\d+\.\d+$/.test(versionInput)) {
              core.setFailed('Invalid version format. Please use <major>.<minor>.<patch> (e.g. 1.2.3)');
              return;
            }
            let newVersion = versionInput;
            if (stabilityInput !== 'stable') {
              if (!/^(alpha|beta|rc)$/.test(stabilityInput)) {
                core.setFailed('Invalid stability value. Please use alpha, beta, rc, or stable.');
                return;
              }
              if (!/^\d+$/.test(unstableSerialInput) || parseInt(unstableSerialInput) <= 0) {
                core.setFailed('Invalid unstable serial number. Please provide a positive integer (e.g. 1 for alpha.1).');
                return;
              }
              newVersion += `-${stabilityInput}.${unstableSerialInput}`;
            }
            execSync('git config user.name "GitHub"');
            execSync('git config user.email "noreply@github.com"');
            execSync(`./set-version ${newVersion}`);
            const newHeadSHA = execSync('git rev-parse HEAD').toString().trim();
            core.setOutput('push', 'yes');
            core.setOutput('new_version', newVersion);
            core.setOutput('new_head_sha', newHeadSHA);

      - name: Inspect pushed tag
        if: startsWith(github.ref, 'refs/tags/v') && !steps.inspect_workflow_dispatch.outputs.new_version
        id: inspect_pushed_tag
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const versionTagName = context.ref.replace('refs/tags/', '');
            const versionFromTag = versionTagName.substring(1).toLowerCase();
            const buildGradleContents = fs.readFileSync('app/build.gradle.kts', 'utf8');
            const match = buildGradleContents.match(/versionName\s*=\s*"([^"]+)"/);
            if (!match) {
              core.setFailed('Could not find versionName in app/build.gradle.kts');
              return;
            }
            const versionFromGradle = match[1];
            if (versionFromTag !== versionFromGradle) {
              core.setFailed(`Tag version (${versionFromTag}) does not match build.gradle.kts version (${versionFromGradle})`);
              return;
            }
            core.setOutput('version_from_tag', versionFromTag);

      - name: Resolve release details
        id: resolve_release
        if: steps.inspect_workflow_dispatch.outputs.new_version || steps.inspect_pushed_tag.outputs.version_from_tag
        uses: actions/github-script@v7
        with:
          script: |
            const TRACK_TEST_INTERNAL = 'internal';
            const TRACK_TEST_CLOSED = 'alpha';
            const TRACK_TEST_OPEN = 'beta';
            const TRACK_PRODUCTION = 'production';

            const PLAYSTORE_TRACK_MAP = {
              alpha: TRACK_TEST_INTERNAL,
              beta: TRACK_TEST_CLOSED,
              rc: TRACK_TEST_CLOSED,
            };

            const fs = require('fs');
            const { execSync } = require('child_process');

            const versionFromDispatch = '${{ steps.inspect_workflow_dispatch.outputs.new_version }}';
            const versionFromTag = '${{ steps.inspect_pushed_tag.outputs.version_from_tag }}';
            const version = versionFromDispatch || versionFromTag;
            core.setOutput('version', version);
            const versionTagName = `v${version}`;
            core.setOutput('version_tag', versionTagName);

            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
            
            const preReleaseMatch = version.match(/-(alpha|beta|rc)\.\d+$/);
            const preReleaseType = preReleaseMatch ? preReleaseMatch[1] : null;
            const isPreRelease = preReleaseType !== null;
            const playStoreTrack = isPreRelease ? PLAYSTORE_TRACK_MAP[preReleaseType] : TRACK_PRODUCTION;
            core.setOutput('is_pre_release', isPreRelease ? 'true' : 'false');
            core.setOutput('play_store_track', playStoreTrack);

            const tagFilter = preReleaseType
              ? new RegExp(`^v?\\d+\\.\\d+\\.\\d+-${preReleaseType}\\.\\d+$`)
              : new RegExp(`^v?\\d+\\.\\d+\\.\\d+$`)
            ;
            const previousTags = execSync('git tag --sort=-version:refname --merged HEAD^')
              .toString()
              .trim()
              .replace(/\r/g, '\n')
              .split('\n')
              .filter(tag => tagFilter.test(tag))
            ;
            let prevTag = previousTags.length > 0 ? previousTags[0] : '';
            if (prevTag === versionTagName) {
              prevTag = '';
            }
            let releaseNotes;
            let changelogUrl;
            if (prevTag === '') {
              core.info('No previous tag found, generating release notes from all commits.');
              releaseNotes = 'First release';
              changelogUrl = `${repoUrl}/releases/tag/${versionTagName}`
            } else {
              core.info(`Previous tag found: ${prevTag}`);
              const log = execSync(`git log ${prevTag}..HEAD --no-merges --pretty=format:%s`).toString();
              releaseNotes = log
                .replace(/[\r\n]+/g, '\n')
                .split('\n')
                .map(line => line.trim())
                .filter(line => !/^minor /i.test(line) && !/^\[minor\]/i.test(line))
                .filter(line => !/^Version \d+\.\d+\.\d+/i.test(line))
                .map(line => line.replace(/\s*\(#\d+\)$/, ''))
                .filter(line => line.length > 0)
                .map(line => `- ${line}`)
                .join('\n')
              ;
              changelogUrl = `${repoUrl}/compare/${prevTag}...${versionTagName}`;
            }
            const releaseNotesWithChangelogUrl = releaseNotes
              ? `${releaseNotes}\n\nFull Changelog: ${changelogUrl}`
              : `Full Changelog: ${changelogUrl}`;

            core.setOutput('github_release_notes', releaseNotesWithChangelogUrl);
            core.startGroup('Release notes for GitHub Release');
            core.info(releaseNotesWithChangelogUrl);
            core.endGroup();

            const playStoreMaxLength = 500;
            let playStoreReleaseNotes;
            if (releaseNotesWithChangelogUrl.length <= playStoreMaxLength) {
              playStoreReleaseNotes = releaseNotesWithChangelogUrl;
            } else if (releaseNotes.length <= playStoreMaxLength) {
              playStoreReleaseNotes = releaseNotes;
            } else {
              playStoreReleaseNotes = releaseNotes.substring(0, playStoreMaxLength - 3) + '...'
            }
            const whatsnewDir = `${process.env.RUNNER_TEMP}/whatsnew`;
            fs.mkdirSync(whatsnewDir, { recursive: true });
            fs.writeFileSync(`${whatsnewDir}/whatsnew-en-US`, playStoreReleaseNotes);
            core.setOutput('whatsnew_dir', whatsnewDir);
            core.startGroup('Release notes for Play Store');
            core.info(playStoreReleaseNotes);
            core.endGroup();

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Decode Keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            if [ -z "${{ steps.resolve_release.outputs.version }}" ]; then
              echo "No keystore provided, skipping signing setup for non-release build."
            else
              echo "Error: No keystore provided for release build. Please set the KEYSTORE_BASE64 secret."
              exit 1
            fi
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> $GITHUB_OUTPUT
            echo "Keystore decoded and saved to $RUNNER_TEMP/release.keystore"
          fi

      - name: Build
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --build-cache

      - name: List build outputs
        run: find app/build/outputs -name '*.aab' -o -name '*.apk' | sort

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: app-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Push new version commit
        if: steps.inspect_workflow_dispatch.outputs.push == 'yes'
        run: git push && git push --tags

      - name: Publish to Play Store (${{ steps.resolve_release.outputs.play_store_track }})
        if: steps.resolve_release.outputs.version
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: it.locati.michele.redialer
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ steps.resolve_release.outputs.play_store_track }}
          status: draft
          whatsNewDirectory: ${{ steps.resolve_release.outputs.whatsnew_dir }}

      - name: Create GitHub Release
        if: steps.resolve_release.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ steps.inspect_workflow_dispatch.outputs.new_head_sha || github.sha }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          body: ${{ steps.resolve_release.outputs.github_release_notes }}
          tag_name: ${{ steps.resolve_release.outputs.version_tag }}
          name: Release ${{ steps.resolve_release.outputs.version }}
          prerelease: ${{ steps.resolve_release.outputs.is_pre_release == 'true' }}
          make_latest: ${{ steps.resolve_release.outputs.is_pre_release == 'false' }}
          # see https://github.com/softprops/action-gh-release/commit/b959f31e968fb47fb7bb823087fc092d5613e0a4
          draft: ${{ steps.resolve_release.outputs.is_pre_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # see https://github.com/softprops/action-gh-release/commit/b959f31e968fb47fb7bb823087fc092d5613e0a4
      - name: Finalize release
        if: steps.resolve_release.outputs.version && steps.resolve_release.outputs.is_pre_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ steps.resolve_release.outputs.version_tag }} --draft=false
